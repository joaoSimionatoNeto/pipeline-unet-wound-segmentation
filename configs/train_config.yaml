projeto:
  nome: wound_segmentation
  seed: 42
  dispositivo: auto
caminhos:
  imagens_treino: data/particoes/grid_resnet50/train/images
  mascaras_treino: data/particoes/grid_resnet50/train/masks
  imagens_validacao: data/particoes/grid_resnet50/validation/images
  mascaras_validacao: data/particoes/grid_resnet50/validation/masks
  imagens_processadas: data/processed
  checkpoints: checkpoints
  logs: logs
  resultados: results
  imagens_teste: data/particoes/grid_resnet50/test/images
  mascaras_teste: data/particoes/grid_resnet50/test/masks
dados:
  extensao_imagem: null
  extensao_mascara: ".png"
  proporcao_treino: 0.70
  proporcao_validacao: 0.15
  proporcao_teste: 0.15
  estratificar_por: null       # ex: "tipo_ferida" (coluna de um CSV de metadados)
  arquivo_metadados: null      # CSV opcional com colunas [arquivo, tipo_ferida, tom_pele]

pipelines:
  unet_resnet50:
    ativo: true
    encoder: resnet50
    encoder_pretrained: true
    fine_tuning: true
    usar_opencv: false
    diretorio_experimento: experiments/unet_resnet50
  unet:
    ativo: true
    canais_base: 64
    profundidade: 4
    usar_opencv: false
    diretorio_experimento: experiments/unet
  unet_resnet50_opencv:
    ativo: true
    encoder: resnet50
    encoder_pretrained: true
    fine_tuning: true
    usar_opencv: true
    diretorio_experimento: experiments/unet_resnet50_opencv
  unet_opencv:
    ativo: true
    canais_base: 64
    profundidade: 4
    usar_opencv: true
    diretorio_experimento: experiments/unet_opencv
pre_processamento_opencv:
  redimensionar:
    ativo: true
    tamanho:
    - 512
    - 512
  equalizacao_histograma:
    ativo: false
  clahe:
    ativo: true
    clip_limit: 4.0
    tile_grid_size:
    - 8
    - 8
  remocao_ruido_gaussiano:
    ativo: false
    kernel_size: 5
  filtro_mediano:
    ativo: true
    kernel_size: 3
  ajuste_contraste:
    ativo: false
    alpha: 1.2
    beta: 10
  conversao_espaco_cor:
    ativo: false
    destino: LAB
  normalizacao:
    ativo: true
    media:
    - 0.485
    - 0.456
    - 0.406
    desvio_padrao:
    - 0.229
    - 0.224
    - 0.225
  sharpening:
    ativo: false
  correcao_iluminacao:
    ativo: false
data_augmentation:
  ativo: true
  aplicar_em_todas_imagens_treino: true
  horizontal_flip:
    ativo: true
    probabilidade: 0.5
  vertical_flip:
    ativo: true
    probabilidade: 0.5
  rotacao_90:
    ativo: false
    probabilidade: 0.5
  shift_scale_rotate:
    ativo: true
    shift_limit: 0.25
    rotate_limit: 180
    scale_limit: 0.25
    shear_limit: 17.5
    probabilidade: 0.5
  gaussian_blur:
    ativo: true
    kernel_size: [25, 25]
    sigma: [0.001, 2.0]
    probabilidade: 0.5
  color_jitter:
    ativo: true
    brilho: 0.125
    contraste: 0.5
    saturacao: 0.5
    matiz: 0.05
    probabilidade: 0.5
  random_brightness:
    ativo: false
    brightness_limit: [-0.125, 0.125]
    probabilidade: 0.5
  random_contrast:
    ativo: false
    probabilidade: 0.8
    contrast_limit: 0.5
  grid_distortion:
    ativo: false
    probabilidade: 0.5
    distort_limit: 0.3411
  grid_dropout:
    ativo: false
    probabilidade: 0.5
    ratio: 0.3
  augmentation_strength: 1.0
treinamento:
  batch_size: 8
  gradient_accumulation:
    ativo: false
    accum_steps: 0
  epochs: 200
  learning_rate: 0.0001
  optimizer: adamw
  loss: bce
  image_size: 512
  num_workers: 4
  mixed_precision: true
  gradient_clipping:
    ativo: true
    max_norm: 1.0
  early_stopping:
    ativo: true
    paciencia: 20
    delta_minimo: 0.001
    metrica_monitorada: val_iou
    modo: max
  lr_scheduler:
    tipo: rex
  checkpoint:
    salvar_melhor: true
    salvar_ultimo: true
    metrica_monitorada: val_iou
perdas:
  focal:
    alpha: 0.8
    gamma: 2.0
  tversky:
    alpha: 0.7
    beta: 0.3
modelo:
  imagenet_normalizacao: true
  tversky_balanceado_ativo: false
avaliacao:
  limiar_binarizacao: 0.1
  salvar_predicoes: true
  gerar_matriz_confusao: true
  gerar_graficos_comparativos: true
optuna:
  pipeline: unet_resnet50
  epochs_por_trial: 120
  diretorio: results/optuna
  config_saida: configs/train_config_optuna.yaml
