projeto:
  nome: wound_segmentation
  seed: 42
  dispositivo: auto
caminhos:
  imagens_treino: data/particoes/grid_resnet50/train/images
  mascaras_treino: data/particoes/grid_resnet50/train/masks
  imagens_validacao: data/particoes/grid_resnet50/validation/images
  mascaras_validacao: data/particoes/grid_resnet50/validation/masks
  imagens_processadas: data/processed
  checkpoints: checkpoints
  logs: logs
  resultados: results
  imagens_teste: data/particoes/grid_resnet50/test/images
  mascaras_teste: data/particoes/grid_resnet50/test/masks
dados:
  extensao_imagem: null
  extensao_mascara: .png
  proporcao_treino: 0.7
  proporcao_validacao: 0.15
  proporcao_teste: 0.15
  estratificar_por: null
  arquivo_metadados: null
pipelines:
  unet_resnet50:
    ativo: true
    encoder: resnet50
    encoder_pretrained: true
    fine_tuning: true
    usar_opencv: false
    diretorio_experimento: experiments/unet_resnet50
  unet:
    ativo: false
    canais_base: 64
    profundidade: 4
    usar_opencv: false
    diretorio_experimento: experiments/unet
  unet_resnet50_opencv:
    ativo: false
    encoder: resnet50
    encoder_pretrained: true
    fine_tuning: true
    usar_opencv: true
    diretorio_experimento: experiments/unet_resnet50_opencv
  unet_opencv:
    ativo: false
    canais_base: 64
    profundidade: 4
    usar_opencv: true
    diretorio_experimento: experiments/unet_opencv
pre_processamento_opencv:
  redimensionar:
    ativo: true
    tamanho:
    - 512
    - 512
  equalizacao_histograma:
    ativo: false
  clahe:
    ativo: true
    clip_limit: 2.0
    tile_grid_size:
    - 8
    - 8
  remocao_ruido_gaussiano:
    ativo: true
    kernel_size: 5
  filtro_mediano:
    ativo: false
    kernel_size: 5
  ajuste_contraste:
    ativo: false
    alpha: 1.2
    beta: 10
  conversao_espaco_cor:
    ativo: false
    destino: LAB
  normalizacao:
    ativo: true
    media:
    - 0.485
    - 0.456
    - 0.406
    desvio_padrao:
    - 0.229
    - 0.224
    - 0.225
  sharpening:
    ativo: false
  correcao_iluminacao:
    ativo: true
data_augmentation:
  ativo: true
  random_brightness_contrast:
    ativo: true
    probabilidade: 0.4
    brightness_limit: 0.2
    contrast_limit: 0.2
  hue_saturation_value:
    ativo: true
    probabilidade: 0.3
    hue_shift_limit: 10
    sat_shift_limit: 15
    val_shift_limit: 10
  gamma:
    ativo: true
    probabilidade: 0.3
    limite: [80, 120]
  clahe:
    ativo: true
    probabilidade: 0.3
  gaussian_noise:
    ativo: true
    probabilidade: 0.2
  blur:
    ativo: true
    probabilidade: 0.2
  cutout:
    ativo: true
    probabilidade: 0.3
    num_holes_range: [1, 8]
    hole_height_range: [0.02, 0.12]
    hole_width_range: [0.02, 0.12]
    fill: 0
treinamento:
  batch_size: 2
  gradient_accumulation:
    ativo: true
    accum_steps: 8
  epochs: 200
  learning_rate: 0.0001
  optimizer: adamw
  weight_decay: 1.0e-05
  loss: dice_bce
  image_size: 512
  num_workers: 4
  mixed_precision: true
  gradient_clipping:
    ativo: true
    max_norm: 1.0
  early_stopping:
    ativo: true
    paciencia: 15
    metrica_monitorada: val_dice
    modo: max
  lr_scheduler:
    tipo: reduce_on_plateau
    paciencia: 5
    fator: 0.5
  checkpoint:
    salvar_melhor: true
    salvar_ultimo: true
    metrica_monitorada: val_dice
perdas:
  focal:
    alpha: 0.8
    gamma: 2.0
  tversky:
    alpha: 0.7
    beta: 0.3
modelo:
  imagenet_normalizacao: true
  tversky_balanceado_ativo: false
avaliacao:
  limiar_binarizacao: 0.5
  salvar_predicoes: true
  gerar_matriz_confusao: true
  gerar_graficos_comparativos: true
optuna:
  pipeline: unet_resnet50
  epochs_por_trial: 40
  diretorio: results/optuna
  config_saida: configs/train_config_optuna.yaml
